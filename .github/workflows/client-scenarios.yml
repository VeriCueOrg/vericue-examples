name: client scenarios

# Builds the example applications and runs the CI/reporting flow
# (clients/ci/run.sh) against a public veriCue release, then uploads the JUnit
# XML, the veriCue HTML report and the screenshot the scenario captures.
#
# The job downloads the public veriCue package the same way a customer does,
# builds the example applications against it and runs the CI/reporting flow.
#
# It ran on workflow_dispatch only between 2026-08-14 and 2026-08-16, because
# dl.vericue.dev answered 403 (cf-mitigated: challenge) to GitHub-hosted
# runners for the SDK tarballs and install.sh alike - VeriCueOrg/vericue#33.
# Nothing in this repository could work around that, and a workflow that fails
# on every public PR for a reason unrelated to the change under review is worse
# than no workflow. The WAF configuration was fixed and the download canary
# proved it from ubuntu-latest (run 31937411511), so this runs on pushes and
# pull requests again.
#
# The flow needs no secrets and no licence file - the veriCue Runtime falls
# back to its built-in 30-day trial. Everything it needs is public.
#
# What this job does NOT prove: Windows, macOS, Qt 6, a real display server, or
# any Qt rendering stack other than the one in this image. It is one runner,
# and it is offscreen. See clients/README.md.

on:
  push:
    branches: [master]
  pull_request:
  workflow_dispatch:
    inputs:
      sdk_url:
        description: veriCue SDK tarball (Qt 5.15, Linux x64)
        required: false
        default: https://dl.vericue.dev/v0.4.0/vericue-0.4.0-qt5.15-linux-x64.tar.gz

permissions:
  contents: read

jobs:
  ci-reporting-flow:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # Ubuntu ships Qt 5.15, which the qt5.15 veriCue build below runs on.
      - name: Install Qt 5.15
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            qtbase5-dev qtbase5-dev-tools libgl1-mesa-dev

      - name: Download the veriCue SDK
        env:
          # inputs.sdk_url exists only on workflow_dispatch; on push and
          # pull_request it is empty, so the default belongs here as well.
          SDK_URL: ${{ inputs.sdk_url || 'https://dl.vericue.dev/v0.4.0/vericue-0.4.0-qt5.15-linux-x64.tar.gz' }}
        run: |
          if ! curl -fsSL -o vericue.tar.gz "$SDK_URL"; then
            echo "::error::Could not download $SDK_URL."
            echo "::error::If this is a 403, the Cloudflare WAF may be challenging"
            echo "::error::GitHub-hosted runners again - that was VeriCueOrg/vericue#33,"
            echo "::error::and the download canary in this repository watches for it."
            echo "::error::Otherwise pass sdk_url pointing at your own mirror."
            exit 1
          fi
          mkdir -p "$HOME/vericue"
          tar xzf vericue.tar.gz -C "$HOME/vericue" --strip-components=1

      - name: Build the example applications
        run: |
          cmake -B build -DCMAKE_BUILD_TYPE=Release \
                -DCMAKE_PREFIX_PATH="$HOME/vericue"
          cmake --build build --parallel

      - name: Install the veriCue Python client
        run: python3 -m pip install --upgrade "vericue==0.4.0" pytest pytest-asyncio

      - name: Run the CI/reporting flow
        env:
          # The runner has no display; the flow scripts fall back to
          # QT_QPA_PLATFORM=offscreen on their own, but be explicit here.
          QT_QPA_PLATFORM: offscreen
          LD_LIBRARY_PATH: /home/runner/vericue/lib
          VERICUE_ARTIFACT_DIR: ${{ github.workspace }}/ci-artifacts
        run: clients/ci/run.sh

      - name: Upload the reports and screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: vericue-reports
          path: ci-artifacts/
          if-no-files-found: error
